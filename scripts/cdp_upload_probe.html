<!doctype html>
<html>
<head><title>CDP Upload Probe</title></head>
<body style="font-family: sans-serif; max-width: 640px; margin: 40px auto;">
<h1>File upload probe</h1>

<!-- Case 1: plain visible file input -->
<h3>1. Visible input</h3>
<input type="file" id="plain-input">

<!-- Case 2: hidden input behind a styled button (Greenhouse/Ashby pattern) -->
<h3>2. Hidden input behind a button</h3>
<input type="file" id="hidden-input" style="display:none">
<button onclick="document.getElementById('hidden-input').click()">Upload resume</button>

<!-- Case 3: input with a data-testid, no id (Rippling pattern) -->
<h3>3. data-testid only</h3>
<input type="file" data-testid="input-resume" style="opacity:0;position:absolute;">

<!-- Case 4: input inside a shadow DOM (SmartRecruiters pattern) -->
<h3>4. Shadow DOM</h3>
<div id="shadow-host"></div>

<!-- Case 5: input inside a same-origin iframe -->
<h3>5. Same-origin iframe</h3>
<iframe id="frame" srcdoc='<input type="file" id="iframe-input">' style="width:100%;height:60px"></iframe>

<hr>
<h3>Detected uploads</h3>
<pre id="log">(none yet)</pre>

<script>
const host = document.getElementById('shadow-host');
const root = host.attachShadow({mode: 'open'});
root.innerHTML = '<input type="file" id="shadow-input">';

const results = {};
function record(name, files) {
  results[name] = files && files.length ? Array.from(files).map(f => f.name) : [];
  document.getElementById('log').textContent = JSON.stringify(results, null, 2);
}
function watch(el, name) {
  if (!el) return;
  el.addEventListener('change', () => record(name, el.files));
}
watch(document.getElementById('plain-input'), 'plain');
watch(document.getElementById('hidden-input'), 'hidden');
watch(document.querySelector('[data-testid=input-resume]'), 'testid');
watch(root.getElementById('shadow-input'), 'shadow');
document.getElementById('frame').addEventListener('load', () => {
  const d = document.getElementById('frame').contentDocument;
  const el = d.getElementById('iframe-input');
  if (el) el.addEventListener('change', () => record('iframe', el.files));
});

// Expose a poll-able summary that does NOT depend on change events firing,
// so a probe can distinguish "files set on the element" from "page noticed".
window.__uploadState = function () {
  const q = (sel, doc) => (doc || document).querySelector(sel);
  const state = {};
  const add = (name, el) => {
    state[name] = el ? Array.from(el.files || []).map(f => f.name) : null;
  };
  add('plain', q('#plain-input'));
  add('hidden', q('#hidden-input'));
  add('testid', q('[data-testid=input-resume]'));
  add('shadow', root.getElementById('shadow-input'));
  try {
    add('iframe', q('#iframe-input', document.getElementById('frame').contentDocument));
  } catch (e) { state.iframe = 'cross-origin'; }
  return JSON.stringify(state);
};
</script>
</body>
</html>
